{% extends "layout.html" %}
{% block title %}Profile Setup | Pivo{% endblock %}

{% block body %}

<div class="section">
    <h2 class="card-title mb-3">Complete Your Profile</h2>

    <form method="post" class="d-grid">
        {% csrf_token %}
        
<div>
  <label class="form-label">Gender</label>
  <select name="gender" class="form-control" required>
    <option value="female">Female</option>
    <option value="male">Male</option>
  </select>
</div>

        <div>
            <label class="form-label">Age</label>
            <input class="form-control" type="number" name="age" required>
        </div>

        <div>
            <label class="form-label">Weight (kg)</label>
            <input class="form-control" type="number" step="0.1" name="weight" required>
        </div>

        <div>
            <label class="form-label">Height (cm)</label>
            <input class="form-control" type="number" step="0.1" name="height" required>
        </div>

        <div>
            <label class="form-label">Objective</label>
            <select class="form-control" name="objective" required>
                <option value="lose">Lose Weight</option>
                <option value="gain">Gain Weight</option>
                <option value="maintain">Maintain Weight</option>
            </select>
        </div>

        <button class="btn-primary-min mt-3" type="submit">Save</button>
    </form>
</div>

{% endblock %}
