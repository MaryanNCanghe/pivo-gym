{% extends "layout.html" %}
{% load static %}

{% block title %}Exercise Library — PIVO{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/exercise-list.css' %}">
<script src="{% static 'js/exercise-list.js' %}" defer></script>
{% endblock %}

{% block body %}


<section class="exercise-section">

<header class="page-header">
  <a href="/workouts/" class="back-link">← Back</a>
</header>

  <form id="exercise-search-form" class="search-row">

    <input name="q" placeholder="Search exercise…" />

    <select name="bodyPart">
      <option value="">All body parts</option>
      <option value="back">Back</option>
      <option value="cardio">Cardio</option>
      <option value="chest">Chest</option>
      <option value="lower arms">Lower Arms</option>
      <option value="lower legs">Lower Legs</option>
      <option value="neck">Neck</option>
      <option value="shoulders">Shoulders</option>
      <option value="upper arms">Upper Arms</option>
      <option value="upper legs">Upper Legs</option>
      <option value="waist">Waist</option>
    </select>

    <select name="equipment">
      <option value="">Any equipment</option>
      <option value="barbell">Barbell</option>
      <option value="dumbbell">Dumbbell</option>
      <option value="cable">Cable</option>
      <option value="body weight">Body Weight</option>
      <option value="band">Band</option>
      <option value="kettlebell">Kettlebell</option>
      <option value="machine">Machine</option>
    </select>

    <button type="submit" class="btn-primary">
      Search
    </button>

  </form>

  <div id="exercise-results"></div>

</section>


<div id="exercise-modal" class="fullscreen-modal hidden">

  <button id="close-exercise" class="fullscreen-close">✕</button>

  <div id="exercise-full"></div>

</div>

{% endblock %}
