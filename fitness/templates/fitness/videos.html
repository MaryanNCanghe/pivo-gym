{% extends "layout.html" %}
{% load static %}
{% block title %}Video Library | PIVO{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/videos.css' %}">
{% endblock %}

{% block body %}

<div class="vid-header">
  <h1 class="card-title">Video Library</h1>
  <p class="text-muted-pivo">Curated workouts for women</p>
</div>

<!-- Category filters -->
<div class="vid-filters" id="vidFilters">
  <button class="vid-filter-btn active" data-cat="all">All</button>
  <button class="vid-filter-btn" data-cat="full-body">Full Body</button>
  <button class="vid-filter-btn" data-cat="glutes">Glutes &amp; Legs</button>
  <button class="vid-filter-btn" data-cat="core">Core</button>
  <button class="vid-filter-btn" data-cat="upper">Upper Body</button>
  <button class="vid-filter-btn" data-cat="hiit">HIIT</button>
  <button class="vid-filter-btn" data-cat="yoga">Yoga &amp; Pilates</button>
  <button class="vid-filter-btn" data-cat="stretch">Stretching</button>
</div>

<!-- Video grid -->
<div class="vid-grid" id="vidGrid"></div>

<!-- Player modal -->
<div id="vidModal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9000;
     display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:1rem;">
  <div style="background:#fff;border-radius:16px;width:100%;max-width:560px;margin:auto;overflow:hidden;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:.65rem 1rem;">
      <span id="vidModalTitle" style="font-weight:700;font-size:.95rem;color:var(--pebble);"></span>
      <button onclick="closeVidModal()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#888;">&times;</button>
    </div>
    <div style="position:relative;padding-bottom:56.25%;height:0;">
      <iframe id="vidIframe" src="" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
              style="position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>
    </div>
    <div id="vidModalMeta" style="padding:.75rem 1rem 1rem;font-size:.82rem;color:var(--muted);"></div>
  </div>
</div>

<script>
const VIDEOS = [
  // ── Full Body ──────────────────────────────────────────────────
  { id:"azF7RsPXB2k", cat:"full-body", title:"Full Body Workout – No Equipment", sub:"No equipment · Strength & cardio", level:"Intermediate", duration:"40 min" },
  { id:"Emu7uB59E2g", cat:"full-body", title:"30 Min Full Body HIIT", sub:"No equipment · High-intensity intervals", level:"Intermediate", duration:"30 min" },
  { id:"aFBRopKNGfw", cat:"full-body", title:"Low Impact Full Body HIIT", sub:"No equipment · No jumping, apartment-friendly", level:"Beginner", duration:"30 min" },
  { id:"Ghiu6mvEb-Y", cat:"full-body", title:"30 Min No Equipment Full Body", sub:"No equipment · All fitness levels", level:"All levels", duration:"30 min" },

  // ── Glutes & Legs ──────────────────────────────────────────────
  { id:"8W7U_XT_Pa0", cat:"glutes", title:"15 Min Targeted Glute Workout", sub:"Dumbbells · Glute activation & burn", level:"Intermediate", duration:"15 min" },
  { id:"2Qd-LJNJYWA", cat:"glutes", title:"30 Min Glute & Lower Body", sub:"Dumbbells · Glutes, hamstrings & quads", level:"Intermediate", duration:"30 min" },
  { id:"ZZI__bqlBkQ", cat:"glutes", title:"20 Min Dumbbell Leg Workout", sub:"Dumbbells · Squats & Romanian deadlifts", level:"Intermediate", duration:"20 min" },

  // ── Core ────────────────────────────────────────────────────────
  { id:"zp8WhHeuJws", cat:"core", title:"Complete Core Pilates Workout", sub:"No equipment · Full core pilates", level:"All levels", duration:"20 min" },
  { id:"BHiXrSyQl0w", cat:"core", title:"Core & Waist Tightening", sub:"No equipment · Abs, obliques & lower core", level:"Beginner", duration:"15 min" },
  { id:"LGHF-cp1l2o", cat:"core", title:"Pilates Core Routine", sub:"No equipment · Pilates-style core burn", level:"All levels", duration:"12 min" },

  // ── Upper Body ─────────────────────────────────────────────────
  { id:"k3MCRVbdKG0", cat:"upper", title:"20 Min Arms, Shoulders & Core", sub:"Light weights optional · Upper body sculpt", level:"Intermediate", duration:"20 min" },
  { id:"GPoidnR6Ngs", cat:"upper", title:"30 Min Upper Body & Abs Sculpt", sub:"Light weights optional · Full upper body + abs", level:"Intermediate", duration:"30 min" },

  // ── HIIT ────────────────────────────────────────────────────────
  { id:"LI9yb8HRkRo", cat:"hiit", title:"30 Min Low Impact HIIT", sub:"No equipment · Fat-burning intervals", level:"All levels", duration:"30 min" },
  { id:"bZffvaBeD7s", cat:"hiit", title:"15 Min Low Impact HIIT", sub:"No equipment · No jumping, no noise", level:"Beginner", duration:"15 min" },
  { id:"xAD2OHQqtpQ", cat:"hiit", title:"Low Impact Cardio HIIT", sub:"No equipment · Zero jumping cardio blast", level:"Beginner", duration:"20 min" },

  // ── Yoga & Pilates ─────────────────────────────────────────────
  { id:"v7AYKMP6rOE", cat:"yoga", title:"Yoga For Complete Beginners", sub:"No equipment · Perfect starting point", level:"Beginner", duration:"20 min" },
  { id:"AB3Y-4a3ZrU", cat:"yoga", title:"30 Min Yoga For Beginners", sub:"No equipment · Foundation poses & slow flow", level:"Beginner", duration:"30 min" },
  { id:"oMOgnSMcfM0", cat:"yoga", title:"Yoga for Core & Booty", sub:"No equipment · Core & glute vinyasa flow", level:"All levels", duration:"30 min" },

  // ── Stretching ─────────────────────────────────────────────────
  { id:"lxuTCHJSers", cat:"stretch", title:"10 Min Full Body Stretch", sub:"No equipment · Head-to-toe tension release", level:"All levels", duration:"10 min" },
  { id:"Yzm3fA2HhkQ", cat:"stretch", title:"Yoga For Flexibility", sub:"No equipment · Open & lengthen tight muscles", level:"All levels", duration:"16 min" },
  { id:"3NtNAQodk8E", cat:"stretch", title:"Yoga Rinse", sub:"No equipment · 15 min refresh & reset", level:"All levels", duration:"15 min" },
];

const levelColor = { Beginner:"#4caf50", Intermediate:"#ff9800", "All levels":"#9c27b0" };

function renderVideos(cat) {
  const grid = document.getElementById("vidGrid");
  const list = cat === "all" ? VIDEOS : VIDEOS.filter(v => v.cat === cat);
  grid.innerHTML = list.map(v => `
    <div class="vid-card" onclick="openVideo('${v.id}','${v.title.replace(/'/g,"\\'")}','${v.sub.replace(/'/g,"\\'")}','${v.duration}','${v.level}')">
      <div class="vid-thumb">
        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="${v.title}" loading="lazy">
        <div class="vid-play-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        <span class="vid-duration">${v.duration}</span>
      </div>
      <div class="vid-info">
        <div class="vid-title">${v.title}</div>
        <div class="vid-sub">${v.sub}</div>
        <span class="vid-level" style="background:${levelColor[v.level] || '#888'};">${v.level}</span>
      </div>
    </div>
  `).join("");
}

function openVideo(id, title, sub, duration, level) {
  document.getElementById("vidModalTitle").textContent = title;
  document.getElementById("vidIframe").src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  document.getElementById("vidModalMeta").textContent = `${duration}  ·  ${level}  ·  ${sub}`;
  const modal = document.getElementById("vidModal");
  modal.style.display = "flex";
  modal.hidden = false;
}

function closeVidModal() {
  document.getElementById("vidIframe").src = "";
  const modal = document.getElementById("vidModal");
  modal.style.display = "none";
  modal.hidden = true;
}

document.getElementById("vidModal").addEventListener("click", function(e) {
  if (e.target === this) closeVidModal();
});

document.getElementById("vidFilters").addEventListener("click", e => {
  const btn = e.target.closest(".vid-filter-btn");
  if (!btn) return;
  document.querySelectorAll(".vid-filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderVideos(btn.dataset.cat);
});

renderVideos("all");
</script>

{% endblock %}
