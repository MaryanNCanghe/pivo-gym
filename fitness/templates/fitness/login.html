{% extends "layout.html" %}
{% load static %}

{% block title %}Login | Pivo{% endblock %}

{% block body %}
<div class="fullpage-bg" style="background-image: url('{% static 'images/login-image.jpg' %}');">
  <div class="form-container card-pivo">
    <div style="text-align:center; margin-bottom:1rem;">
      <span style="font-size:2.2rem; font-weight:900; color:var(--olive); letter-spacing:3px;">PIVO</span>
    </div>
    <h2 class="card-title mb-3">Login</h2>

    {% if message %}
      <div class="alert-pivo mb-3">{{ message }}</div>
    {% endif %}

    <form action="{% url 'login' %}" method="post" class="d-grid">
      {% csrf_token %}

      <div>
        <label class="form-label">Username</label>
        <input class="form-control" name="username" placeholder="yourname" required>
      </div>

      <div>
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="d-flex justify-content-between mt-2">
        <a class="btn-outline-min" href="{% url 'register' %}">Register</a>
        <button class="btn-primary-min" type="submit">Login</button>
      </div>

      <div class="text-center mt-3">
        <a href="{% url 'password_reset' %}" style="font-size: .9rem; color: var(--muted); font-weight: 500;">Forgot your password?</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
