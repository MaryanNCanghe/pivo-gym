{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}PIVO{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="{% static 'js/script.js' %}" defer></script>

  <link href="{% static 'css/pivo.css' %}" rel="stylesheet">

  {% block head %}{% endblock %}
</head>

<body>

{% if user.is_authenticated %}
<nav class="navbar"
     style="background: var(--ivory); border-bottom: 1px solid var(--border);">
  <div class="container">

    <a class="navbar-brand"
       style="color: var(--olive); font-weight:900;"
       href="{% url 'index' %}">
      PIVO
    </a>

    <div class="d-flex align-items-center">

      <a href="{% url 'profile' %}">
        <img src="{% static 'images/profile-icon.png' %}"
             class="rounded-circle"
             width="25"
             height="25">
      </a>

     <button class="navbar-toggler pivo-toggler ms-3" type="button"
        style="padding: 4px 6px; width: 32px; height: 32px;"
        data-bs-toggle="offcanvas"
        data-bs-target="#pivoMenu">
    <span class="navbar-toggler-icon pivo-toggler-icon"></span>
</button>

    </div>
  </div>
</nav>

<div class="offcanvas offcanvas-end" id="pivoMenu">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Menu</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <ul class="list-unstyled">

      <li class="mb-3">
        <a href="{% url 'workouts' %}" class="nav-link">Workouts</a>
      </li>

      <li class="mb-3">
        <a href="{% url 'meals' %}" class="nav-link">Meals</a>
      </li>

      <li class="mb-3">
        <a href="{% url 'recipes' %}" class="nav-link">Recipes</a>
      </li>

      <li class="mb-3">
        <a href="{% url 'steps' %}" class="nav-link">Steps</a>
      </li>

      <li class="mb-3">
        <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
      </li>
      <li class="mb-3">
        <a href="{% url 'exercise_list' %}" class="nav-link">Exercise Library</a>
      </li>

      <li class="mb-3">
        <a href="{% url 'ai' %}" class="nav-link">AI Suggestions</a>
      </li>
      <li class="mb-3">
        <a href="{% url 'community' %}" class="nav-link">Community</a>
      </li>
      <li class="mb-3">
        <a href="{% url 'logout' %}" class="nav-link">Logout</a>
      </li>

    </ul>
  </div>
</div>
{% endif %}

<main class="container py-4">
  <div class="section">
    {% block body %}{% endblock %}
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
