{% extends "layout.html" %}
{% load static %}

{% block title %}Reset Password | Pivo{% endblock %}

{% block body %}
<div class="fullpage-bg" style="background-image: url('{% static 'images/login-image.jpg' %}');">
  <div class="form-container card-pivo">
    <h2 class="card-title mb-3">Forgot your password?</h2>
    <p class="text-muted-pivo mb-3">Enter your email address and we'll send you a link to reset your password.</p>

    <form method="post" class="d-grid">
      {% csrf_token %}

      <div>
        <label class="form-label" for="id_email">Email address</label>
        <input class="form-control" type="email" name="email" id="id_email" placeholder="you@example.com" required>
      </div>

      <div class="d-flex justify-content-between mt-2">
        <a class="btn-outline-min" href="{% url 'login' %}">Back to login</a>
        <button class="btn-primary-min" type="submit">Send reset link</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
