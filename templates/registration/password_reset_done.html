{% extends "layout.html" %}
{% load static %}

{% block title %}Email Sent | Pivo{% endblock %}

{% block body %}
<div class="fullpage-bg" style="background-image: url('{% static 'images/login-image.jpg' %}');">
  <div class="form-container card-pivo">
    <h2 class="card-title mb-3">Check your email</h2>
    <p class="text-muted-pivo mb-3">
      We've sent a password reset link to your email address. It may take a few minutes to arrive.
    </p>
    <p class="text-muted-pivo mb-3">
      If you don't see it, check your spam folder.
    </p>
    <div class="d-flex justify-content-center">
      <a class="btn-outline-min" href="{% url 'login' %}">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
