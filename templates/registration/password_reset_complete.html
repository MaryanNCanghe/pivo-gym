{% extends "layout.html" %}
{% load static %}

{% block title %}Password Changed | Pivo{% endblock %}

{% block body %}
<div class="fullpage-bg" style="background-image: url('{% static 'images/login-image.jpg' %}');">
  <div class="form-container card-pivo">
    <h2 class="card-title mb-3">Password changed!</h2>
    <p class="text-muted-pivo mb-3">
      Your password has been set. You can now log in with your new password.
    </p>
    <div class="d-flex justify-content-center">
      <a class="btn-primary-min" href="{% url 'login' %}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
